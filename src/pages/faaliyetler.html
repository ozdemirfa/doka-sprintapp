<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faaliyetler — DOKA Sprint Kanban</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/app.css" />
</head>

<body>
  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <h1>DOKA</h1>
        <p>Sprint Kanban Sistemi</p>
      </div>
      <nav>
        <a href="../index.html"><span class="icon">📋</span> Kanban Board</a>
        <a href="sprint-ozet.html"><span class="icon">📊</span> Sprint Özet</a>
        <a href="faaliyetler.html" class="active"><span class="icon">📁</span> Faaliyetler</a>
        <a href="retro.html"><span class="icon">🔁</span> Retrospektif</a>
        <a href="performans.html"><span class="icon">🎯</span> Perf. Özeti</a>
        <a href="sprint-perf-gos.html"><span class="icon">📈</span> Perf. Gerçekleşmeleri</a>
        <a href="harcamalar.html"><span class="icon">💰</span> Harcamalar</a>
        <a href="izinler.html"><span class="icon">🗓️</span> İzinler & Saha</a>
        <a href="parola.html"><span class="icon">🔑</span> Parola İşlemleri</a>
        <a href="ayarlar.html"><span class="icon">⚙️</span> Ayarlar</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info"><strong id="user-name">Yükleniyor...</strong>Ekip Üyesi</div>
        <button class="btn-logout" id="logout-btn">⇐ Çıkış Yap</button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
      <div class="page-header">
        <h2>Faaliyetler</h2>
        <div style="display:flex;gap:10px;align-items:center;">
          <select id="filter-sop" class="form-control" style="width:auto;min-width:120px;">
            <option value="">Tüm SOPlar</option>
          </select>
          <button class="btn-gold" id="yeni-faaliyet-btn">+ Yeni Faaliyet</button>
        </div>
      </div>

      <div class="page-body">
        <div id="faaliyetler-container">
          <p style="color:#64748b;font-size:0.875rem;">Yükleniyor...</p>
        </div>
      </div>
    </div>

  </div>

  <!-- Yeni Faaliyet Modalı -->
  <div class="modal-overlay hidden" id="modal-faaliyet">
    <div class="modal-box" style="max-width:520px;">
      <h3 id="modal-faaliyet-title">Yeni Faaliyet</h3>
      <form id="form-faaliyet">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="form-group">
            <label for="f-skod">SOP *</label>
            <select id="f-skod" class="form-control" required></select>
          </div>
          <div class="form-group">
            <label for="f-kkod">Kategori *</label>
            <select id="f-kkod" class="form-control" required></select>
          </div>
        </div>
        <div class="form-group">
          <label for="f-fkod">Faaliyet Kodu <span style="font-size:0.75rem;color:#64748b;">(otomatik üretilir)</span></label>
          <input type="text" id="f-fkod" class="form-control" readonly style="background:#f8fafc;color:#64748b;" placeholder="Kaydedilince üretilir">
        </div>
        <div class="form-group">
          <label for="f-faaliyet">Faaliyet Adı *</label>
          <input type="text" id="f-faaliyet" class="form-control" required placeholder="Faaliyet açıklaması...">
        </div>
        <div id="modal-faaliyet-error" class="hidden" style="background:#fee2e2;border:1px solid #fca5a5;border-radius:6px;padding:10px;margin-bottom:12px;color:#b91c1c;font-size:0.825rem;"></div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;">
          <button type="button" class="btn-secondary" id="btn-faaliyet-kapat">İptal</button>
          <button type="submit" class="btn-gold">Kaydet</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Yeni Alt Faaliyet Modalı -->
  <div class="modal-overlay hidden" id="modal-alt-faaliyet">
    <div class="modal-box" style="max-width:500px;">
      <h3>Yeni Alt Faaliyet Ekle</h3>
      <form id="form-alt-faaliyet">
        <input type="hidden" id="af-fkod">
        <div class="form-group">
          <label>Bağlı Faaliyet</label>
          <input type="text" id="af-fkod-display" class="form-control" readonly style="background:#f8fafc;">
        </div>
        <input type="hidden" id="af-sno">
        <div class="form-group">
          <label for="af-psure">Plan Süre (gün)</label>
          <input type="number" id="af-psure" class="form-control" step="0.5" min="0.5" placeholder="1">
        </div>
        <div class="form-group">
          <label for="af-altfaaliyet">Alt Faaliyet Adı *</label>
          <textarea id="af-altfaaliyet" class="form-control" rows="3" required placeholder="Alt faaliyet açıklaması..."></textarea>
        </div>
        <div id="modal-af-error" class="hidden" style="background:#fee2e2;border:1px solid #fca5a5;border-radius:6px;padding:10px;margin-bottom:12px;color:#b91c1c;font-size:0.825rem;"></div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;">
          <button type="button" class="btn-secondary" id="btn-af-kapat">İptal</button>
          <button type="submit" class="btn-gold">Kaydet</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { supabase } from '../js/supabase.js'
    import { requireAuth, signOut } from '../js/auth.js'
    import { formatCurrency, getPersonel, renderUserInfo, showToast, hideAyarlarForNonAdmin, applyViewerRestrictions } from '../js/utils.js'

    // ── Auth ─────────────────────────────────────────────────────────
    const session = await requireAuth()
    const personel = await getPersonel(supabase, session.user.id)
    if (personel) renderUserInfo(personel.ad, personel.soyad)
    if (personel) hideAyarlarForNonAdmin(personel)
    if (personel) applyViewerRestrictions(personel)

    document.getElementById('logout-btn').addEventListener('click', () => signOut())

    // ── Referans Veri Yükle ───────────────────────────────────────────
    const [{ data: sopListesi }, { data: kategoriListesi }] = await Promise.all([
      supabase.from('soplar').select('skod,kisa,sop_adi').order('kisa'),
      supabase.from('kategori_tipleri').select('kkod,kategori_adi').order('kkod')
    ])

    // skod → kisa haritası (render için)
    const sopMap = Object.fromEntries((sopListesi || []).map(s => [s.skod, s.kisa]))

    // SOP filtre dropdown
    const filterSop = document.getElementById('filter-sop')
    ;(sopListesi || []).forEach(s => {
      const opt = document.createElement('option')
      opt.value = s.skod
      opt.textContent = s.kisa
      filterSop.appendChild(opt)
    })

    // Modal SOP dropdown
    const fSkod = document.getElementById('f-skod')
    fSkod.innerHTML = '<option value="">Seçin...</option>'
    ;(sopListesi || []).forEach(s => {
      const opt = document.createElement('option')
      opt.value = s.skod
      opt.textContent = `${s.kisa} — ${s.sop_adi || ''}`
      fSkod.appendChild(opt)
    })

    // Modal Kategori dropdown
    const fKkod = document.getElementById('f-kkod')
    fKkod.innerHTML = '<option value="">Seçin...</option>'
    ;(kategoriListesi || []).forEach(k => {
      const opt = document.createElement('option')
      opt.value = k.kkod
      opt.textContent = `${k.kkod} — ${k.kategori_adi}`
      fKkod.appendChild(opt)
    })

    // ── Yeni Faaliyet Modal ───────────────────────────────────────────
    document.getElementById('yeni-faaliyet-btn').addEventListener('click', () => {
      document.getElementById('form-faaliyet').reset()
      document.getElementById('f-fkod').value = ''
      document.getElementById('modal-faaliyet-error').classList.add('hidden')
      document.getElementById('modal-faaliyet').classList.remove('hidden')
    })
    document.getElementById('btn-faaliyet-kapat').addEventListener('click', () => {
      document.getElementById('modal-faaliyet').classList.add('hidden')
    })
    document.getElementById('form-faaliyet').addEventListener('submit', async (e) => {
      e.preventDefault()
      const skod = parseInt(document.getElementById('f-skod').value)
      const kkod = parseInt(document.getElementById('f-kkod').value)
      const faaliyet = document.getElementById('f-faaliyet').value.trim()
      const errEl = document.getElementById('modal-faaliyet-error')
      errEl.classList.add('hidden')

      if (!skod || !kkod) {
        errEl.textContent = 'SOP ve Kategori seçimi zorunludur.'
        errEl.classList.remove('hidden')
        return
      }

      const { error } = await supabase.from('faaliyetler').insert({ skod, kkod, faaliyet })
      if (error) {
        errEl.textContent = error.message
        errEl.classList.remove('hidden')
        return
      }
      document.getElementById('modal-faaliyet').classList.add('hidden')
      showToast('Faaliyet eklendi.', 'success')
      await renderPage()
    })

    // ── Alt Faaliyet Modal ────────────────────────────────────────────
    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('.btn-alt-faaliyet-ekle')
      if (!btn) return
      const fkod = btn.dataset.fkod
      const fad = btn.dataset.fad || fkod
      document.getElementById('af-fkod').value = fkod
      document.getElementById('af-fkod-display').value = `${fkod} — ${fad}`
      document.getElementById('form-alt-faaliyet').reset()
      document.getElementById('af-fkod').value = fkod
      document.getElementById('af-fkod-display').value = `${fkod} — ${fad}`
      document.getElementById('modal-af-error').classList.add('hidden')
      document.getElementById('modal-alt-faaliyet').classList.remove('hidden')
    })
    document.getElementById('btn-af-kapat').addEventListener('click', () => {
      document.getElementById('modal-alt-faaliyet').classList.add('hidden')
    })
    document.getElementById('form-alt-faaliyet').addEventListener('submit', async (e) => {
      e.preventDefault()
      const fkod = document.getElementById('af-fkod').value
      // S.No otomatik: tablodaki en büyük sno + 1
      const { data: maxRow } = await supabase
        .from('alt_faaliyetler').select('sno').order('sno', { ascending: false }).limit(1)
      const sno = (maxRow?.[0]?.sno ?? 0) + 1
      document.getElementById('af-sno').value = sno
      const altFaaliyet = document.getElementById('af-altfaaliyet').value.trim()
      const pSure = parseFloat(document.getElementById('af-psure').value) || null
      const errEl = document.getElementById('modal-af-error')
      errEl.classList.add('hidden')

      const { error } = await supabase.from('alt_faaliyetler').insert({ sno, fkod, alt_faaliyet: altFaaliyet, p_sure: pSure })
      if (error) {
        errEl.textContent = error.message
        errEl.classList.remove('hidden')
        return
      }
      document.getElementById('modal-alt-faaliyet').classList.add('hidden')
      showToast('Alt faaliyet eklendi.', 'success')
      await renderPage()
    })

    // ── SOP Filtresi ─────────────────────────────────────────────────
    document.getElementById('filter-sop').addEventListener('change', renderPage)

    // ── Accordion Toggle ─────────────────────────────────────────────
    document.addEventListener('click', (e) => {
      const header = e.target.closest('.accordion-header')
      if (!header) return
      header.classList.toggle('open')
      const body = header.nextElementSibling
      if (body && body.classList.contains('accordion-body')) {
        body.classList.toggle('open')
      }
    })

    // ── Veri Yükle & Render ───────────────────────────────────────────
    async function renderPage() {
      const sopFilter = document.getElementById('filter-sop').value

      let faaliyetQuery = supabase.from('v_faaliyet_ozet').select('*')
      if (sopFilter) faaliyetQuery = faaliyetQuery.eq('skod', sopFilter)

      const [
        { data: faaliyetOzet },
        { data: altFaaliyetOzet },
        { data: anahtarSonuclar }
      ] = await Promise.all([
        faaliyetQuery,
        supabase.from('v_alt_faaliyet_ozet').select('*'),
        supabase.from('anahtar_sonuclar').select('*').eq('durum', 'Aktif')
      ])

      // ── Render ─────────────────────────────────────────────────────
      const container = document.getElementById('faaliyetler-container')

      if (!faaliyetOzet || faaliyetOzet.length === 0) {
        container.innerHTML = '<p style="color:#64748b;font-size:0.875rem;">Kayıt bulunamadı.</p>'
        return
      }

      // SOP bazında grupla (skod üzerinden)
      const sopGruplari = {}
      for (const f of faaliyetOzet) {
        const sopKisa = sopMap[f.skod] || `SOP-${f.skod}`
        if (!sopGruplari[sopKisa]) sopGruplari[sopKisa] = []
        sopGruplari[sopKisa].push(f)
      }

      // altFaaliyetleri fkod'a göre indexle
      const altMap = {}
      for (const af of (altFaaliyetOzet || [])) {
        if (!altMap[af.fkod]) altMap[af.fkod] = []
        altMap[af.fkod].push(af)
      }

      // anahtar sonuçları sno'ya göre indexle
      const asMap = {}
      for (const as_ of (anahtarSonuclar || [])) {
        if (!asMap[as_.sno]) asMap[as_.sno] = []
        asMap[as_.sno].push(as_)
      }

      let html = ''

    for (const [sop, sopFaaliyetler] of Object.entries(sopGruplari)) {
      // SOP bazında toplam hesapla
      const sopToplamHarcama = sopFaaliyetler.reduce((s, f) => s + (f.harcanan_butce_toplam || 0), 0)
      const sopToplamButce = sopFaaliyetler.reduce((s, f) => s + (f.butce_2026 || 0), 0)

      html += `
    <div class="mb-6">
      <div class="accordion-item" style="border-radius:10px;overflow:hidden;">
        <div class="accordion-header" style="background:var(--navy);color:#fff;border-radius:0;">
          <span style="font-weight:700;font-size:0.9rem;">SOP: ${sop}</span>
          <span style="background:rgba(255,255,255,0.2);border-radius:9999px;padding:2px 10px;font-size:0.75rem;">${sopFaaliyetler.length} faaliyet</span>
          <span style="margin-left:auto;font-size:0.78rem;opacity:0.85;">
            Toplam: ${formatCurrency(sopToplamHarcama)} / ${formatCurrency(sopToplamButce)}
          </span>
        </div>
        <div class="accordion-body open" style="padding:0;background:#f8fafc;">
    `

      for (const faaliyet of sopFaaliyetler) {
        const pct = Math.round((faaliyet.is_durum_ort || 0) * 100)
        const altler = altMap[faaliyet.fkod] || []

        html += `
        <div class="accordion-item" style="margin:12px;border-radius:8px;">
          <div class="accordion-header">
            <div style="flex:1;min-width:0;">
              <div style="font-weight:600;font-size:0.875rem;color:var(--navy);margin-bottom:6px;">${faaliyet.fkod} — ${faaliyet.faaliyet || ''}</div>
              <div style="display:flex;align-items:center;gap:10px;">
                <div class="progress-bar-bg" style="flex:1;max-width:200px;">
                  <div class="progress-bar-fill${pct >= 100 ? ' green' : ''}" style="width:${pct}%;"></div>
                </div>
                <span style="font-size:0.75rem;color:#64748b;white-space:nowrap;">${pct}%</span>
              </div>
            </div>
            <div style="text-align:right;margin-left:16px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;align-items:flex-end;">
              <button class="btn-alt-faaliyet-ekle" data-fkod="${faaliyet.fkod}" data-fad="${(faaliyet.faaliyet || '').replace(/"/g,'')}"
                style="padding:3px 10px;font-size:0.72rem;background:var(--gold);border:none;border-radius:4px;cursor:pointer;font-weight:600;color:var(--navy);">
                + Alt Faaliyet
              </button>
              <div style="font-size:0.72rem;color:#64748b;">Harcanan</div>
              <div style="font-size:0.8rem;font-weight:600;color:var(--navy);">${formatCurrency(faaliyet.harcanan_butce_toplam)}</div>
              <div style="font-size:0.68rem;color:#94a3b8;">/ ${formatCurrency(faaliyet.butce_2026)}</div>
            </div>
          </div>
          <div class="accordion-body">
      `

        // Alt faaliyetler tablosu
        if (altler.length > 0) {
          html += `
            <div style="overflow-x:auto;margin-bottom:16px;">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>S.No</th>
                    <th>Açıklama</th>
                    <th>Plan. Süre (gün)</th>
                    <th>Tekrar</th>
                    <th>İş Yükü</th>
                    <th>Gerçekleşme (%)</th>
                    <th>Harcanan Bütçe</th>
                  </tr>
                </thead>
                <tbody>
        `
          for (const af of altler) {
            const gercPct = Math.round((af.is_durum_oran || 0) * 100)
            const asList = asMap[af.sno] || []

            html += `
                  <tr>
                    <td><span class="badge-sno">${af.sno || '—'}</span></td>
                    <td>
                      <div>${af.alt_faaliyet || '—'}</div>
          `

            if (asList.length > 0) {
              html += `<div style="margin-top:6px;">`
              for (const as_ of asList) {
                html += `
                        <div style="font-size:0.7rem;color:#64748b;padding:2px 0;border-left:2px solid var(--gold);padding-left:6px;margin-bottom:2px;">
                          <strong style="color:var(--navy);">${as_.as_no}.</strong> ${as_.anahtar_sonuc || ''}
                          ${as_.hedef ? `<span style="color:#10b981;"> → Hedef: ${as_.hedef}</span>` : ''}
                          ${as_.olcum ? `<span style="color:#6366f1;"> | Ölçüm: ${as_.olcum}</span>` : ''}
                        </div>
              `
              }
              html += `</div>`
            }

            html += `
                    </td>
                    <td style="text-align:center;">${af.p_sure ?? '—'}</td>
                    <td style="text-align:center;">${af.tekrar_sayisi ?? '—'}</td>
                    <td style="text-align:center;">${af.is_yuku ?? '—'}</td>
                    <td>
                      <div style="display:flex;align-items:center;gap:6px;">
                        <div class="progress-bar-bg" style="flex:1;">
                          <div class="progress-bar-fill${gercPct >= 100 ? ' green' : ''}" style="width:${gercPct}%;"></div>
                        </div>
                        <span style="font-size:0.72rem;color:#64748b;white-space:nowrap;">${gercPct}%</span>
                      </div>
                    </td>
                    <td>${formatCurrency(af.harcanan_butce)}</td>
                  </tr>
          `
          }
          html += `
                </tbody>
              </table>
            </div>
        `
        } else {
          html += `<p style="font-size:0.8rem;color:#94a3b8;margin-bottom:12px;">Alt faaliyet bulunamadı.</p>`
        }

        html += `
          </div>
        </div>
      `
      }

      html += `
        </div>
      </div>
    </div>
    `
    }

      if (html) container.innerHTML = html
    } // end renderPage

    await renderPage()
  </script>
</body>

</html>
